  #servebox .stime{font-size:26px;color:#ffe14d;letter-spacing:2px;line-height:1;}

</style>
</head>
<body>
<div id="game"></div>
<div id="hud"><div id="score"><span class="usa">USA 0</span> — <span class="swe">0 SWE</span></div><div id="touches"></div></div>
<div id="banner">SENSIBLE BEACH VOLLEY
USA vs SWEDEN
PRESS SPACE TO SERVE</div>
<div id="help">MOVE: ARROWS/WASD · <b>Z</b>/<b>X</b>/SPACE: PLANT &amp; AIM (HOLD = HIGHER · 2× = DIVE) · <b>C</b>: RUN-UP (ARROWS = PATH), <b>C</b> AGAIN: SPIKE · <b>1/2/3</b>: COURT · P: PAD</div>
<div id="toast"></div>
<div id="servebox">
  <canvas id="refIcon" width="24" height="24"></canvas>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script type="module">
// ---------- logic: pure simulation, no Three.js / DOM ----------
import { SIDE_USA, SIDE_SWE } from './js/logic/constants.js';
import {
  isOnCourtSide, courtSideAtZ,
} from './js/logic/court.js';
import { createVenue } from './js/logic/venue.js';
import {
  createBall, launchBall, makeFloat, stepBall, recordTrail,
  landingPoint as ballLandingPoint,
} from './js/logic/ball.js';
import {
  createMatch, resetScore, setupServe as setupServeRules, holdBallForServe,
  canServe, aiReadyToServe, startRally, recordTouch, awardPoint, judgeLanding,
  tickPoint, tickServe, SERVE_LIMIT,
} from './js/logic/match.js';
import {
  createPlayers, isBusy, stepJumps, faceAngle,
  startJump as jumpPlayer, startDive as divePlayer, movePlayer as movePlayerBody,
  PLAYER_SPEED, HIT_RADIUS, REACH_GROUND, WINDUP,
} from './js/logic/players.js';
import { createShots } from './js/logic/shots.js';
import { updateHumanControl } from './js/logic/humanControl.js';
// ---------- view: what gets drawn ----------
import { makeTex, flatPlane } from './js/view/textures.js';
import { createVenueView } from './js/view/venueView.js';
import { createPlayersView } from './js/view/playersView.js';
import { createBallView } from './js/view/ballView.js';
import { createAimView } from './js/view/aimView.js';
import { REF_AUTH_TIME } from './js/view/npcView.js';

// ============================================================
// SENSIBLE BEACH VOLLEY — retro top-down 2v2 arcade volleyball
// Fundamentals update: pose sprites (ready/bump/dig/set), body
// orientation toward the ball, cushioned reception, high defensive
// dig with weight back, sand particles, ball trail, threat ring.
// ============================================================

// ---------- constants ----------



// ---------- renderer / scene ----------
const renderer = new THREE.WebGLRenderer({antialias:false});
renderer.setPixelRatio(1);
document.getElementById('game').appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1b2a5e);

const VIEW_H = 22;
let cam = new THREE.OrthographicCamera(-1,1,1,-1,0.1,200);
cam.position.set(0,100,0);
cam.up.set(0,0,-1);
cam.lookAt(0,0,0);

function resize(){
  const w=innerWidth,h=innerHeight;
  renderer.setSize(w,h);
  const aspect=w/h;
  cam.top=VIEW_H/2; cam.bottom=-VIEW_H/2;
  cam.left=-VIEW_H/2*aspect; cam.right=VIEW_H/2*aspect;
  cam.updateProjectionMatrix();
}
addEventListener('resize',resize);

// ---------- courts: logic (venue) + drawing (venueView: courts, camera, referees) ----------
const venue = createVenue();
const venueView = createVenueView(scene, cam, venue);
function court(){ return venue.active; }
const { wx, wz, lz, txFrom } = venue;

function switchCourt(id){
  if(!venue.setActive(id))return;
  venueView.refresh();
  setupServe();
  showToast('COURT · '+court().id.toUpperCase().replace('-',' '));
  beep(620,0.06,'square',0.07);
}

const markerTex = makeTex(10,6,(g)=>{
  g.fillStyle='#ffffff';
  g.fillRect(0,0,10,2);g.fillRect(3,2,4,2);g.fillRect(4,4,2,2);
});
const players=createPlayers();
const playersView=createPlayersView(scene, players);

const ballView=createBallView(scene);
const aimView=createAimView(scene);
const marker=flatPlane(0.6,0.4,markerTex);marker.position.y=0.13;scene.add(marker);
// referees are drawn by js/view/npcView.js; this drives the arm sweep
let authT=0;   // service-authorization sweep timer

// --- sand particles ---
const puffTex=makeTex(3,3,(g)=>{g.fillStyle='#f5e3b0';g.fillRect(0,0,3,3);g.fillStyle='#dcc07a';g.fillRect(1,1,1,1);});
const puffs=[];
for(let i=0;i<28;i++){
  const m=flatPlane(0.22,0.22,puffTex);
  m.visible=false;m.position.y=0.06;scene.add(m);
  puffs.push({m,life:0,vx:0,vz:0});
}
function sandPuff(x,z,n,pow=1){
  let c=0;
  for(const q of puffs){
    if(q.life<=0){
      q.life=0.22+Math.random()*0.16;
      q.m.visible=true;
      q.m.position.set(x+rnd(0.25),0.06,z+rnd(0.25));
      const a=Math.random()*Math.PI*2, s=(1.5+Math.random()*2.5)*pow;
      q.vx=Math.cos(a)*s;q.vz=Math.sin(a)*s;
      if(++c>=n)break;
    }
  }
}
function updatePuffs(dt){
  for(const q of puffs){
    if(q.life>0){
      q.life-=dt;
      q.m.position.x+=q.vx*dt;q.m.position.z+=q.vz*dt;
      const s=Math.max(0.1,q.life*4.5);
      q.m.scale.set(s,s,1);
      if(q.life<=0)q.m.visible=false;
    }
  }
}

// ---------- audio ----------
let AC=null;
function beep(f,d=0.07,type='square',v=0.08){
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(),g=AC.createGain();
    o.type=type;o.frequency.value=f;
    g.gain.setValueAtTime(v,AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+d);
    o.connect(g);g.connect(AC.destination);
    o.start();o.stop(AC.currentTime+d);
  }catch(e){}
}

// ---------- game state ----------
const ball=createBall(SIDE_USA);
const match=createMatch();   // phases, score, service order: js/logic/match.js
const banner=document.getElementById('banner');
const scoreDiv=document.getElementById('score');
const touchDiv=document.getElementById('touches');
let hitstop=0;   // global freeze frames on hard contacts

// --- serve authorization HUD: referee window + 8 second rule ---
const serveBox=document.getElementById('servebox');
const serveTimeEl=document.getElementById('serveTime');
const serveBarEl=document.getElementById('serveBar');
const refIconCv=document.getElementById('refIcon');
let refBlink=0;
function drawRefIcon(blow){
  // stylized first referee in profile, whistle to the mouth
  const g=refIconCv.getContext('2d');
  g.clearRect(0,0,24,24);
  const skin='#d9a066', shirt='#f2f2f8', navy='#22307a';
  g.fillStyle=navy;  g.fillRect(7,3,9,3);   g.fillRect(6,5,3,2);   // cap + visor
  g.fillStyle=skin;  g.fillRect(8,6,7,6);                          // face
  g.fillStyle='#222';g.fillRect(9,8,2,1);                          // eye
  g.fillStyle='#ffd21f';g.fillRect(5,10,4,2);                      // whistle
  g.fillStyle=skin;  g.fillRect(4,12,4,3);                         // hand holding it
  g.fillStyle=shirt; g.fillRect(7,12,10,9);                        // chest
  g.fillStyle=navy;  g.fillRect(7,21,10,3);                        // shorts line
  if(blow){                                                        // whistle blast marks
    g.fillStyle='#ffe14d';
    g.fillRect(1,7,2,1);g.fillRect(0,10,2,1);g.fillRect(1,13,2,1);
  }
}
drawRefIcon(true);

const keys={};
const keysDown={};   // physical key state, never consumed by the game (hold-to-charge)
const btnEdges={bump:false,set:false,atk:false,auto:false};   // dedicated fundamentals buttons + Space
addEventListener('keydown',e=>{
  keys[e.code]=true;keysDown[e.code]=true;
  if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();
  if(!e.repeat){
    if(e.code==='KeyZ'||e.code==='KeyJ')btnEdges.bump=true;   // BAGHER / dive
    if(e.code==='KeyX'||e.code==='KeyK')btnEdges.set=true;    // ALZATA (palleggio o bagher)
    if(e.code==='KeyC'||e.code==='KeyL')btnEdges.atk=true;    // ATTACCO (salto + schiacciata)
    if(e.code==='Space')btnEdges.auto=true;                   // tasto intelligente
  }
  if(e.code==='KeyP'&&pad.connected){cfgOpen?closeCfg():openCfg();return;}
  if(!e.repeat&&(e.code==='Digit1'||e.code==='Digit2'||e.code==='Digit3')){
    const ids=['main','side-left','side-right'];
    const idx=+(e.code.replace('Digit',''))-1;
    if(ids[idx])switchCourt(ids[idx]);
    return;
  }
  if(match.state==='over'&&e.code==='Enter')newMatch();
});
addEventListener('keyup',e=>{keys[e.code]=false;keysDown[e.code]=false;});

// ============================================================
// GAMEPAD (PlayStation-type) — Gamepad API + config wizard
// Left stick / d-pad = move · one configurable ACTION button
// Open config with OPTIONS (btn 9) or the C key when connected
// ============================================================
const PAD_LABELS={0:'CROSS (X)',1:'CIRCLE (O)',2:'SQUARE',3:'TRIANGLE',
  4:'L1',5:'R1',6:'L2',7:'R2',8:'SHARE/CREATE',9:'OPTIONS',
  10:'L3',11:'R3',12:'D-PAD UP',13:'D-PAD DOWN',14:'D-PAD LEFT',15:'D-PAD RIGHT',16:'PS'};
function padLabel(i){return PAD_LABELS[i]||('BUTTON '+i);}

const pad={connected:false,index:null,id:'',btnBump:0,btnSet:2,btnAtk:1,dz:0.28,prev:[]};
const padInput={mx:0,mz:0,bumpPressed:false,setPressed:false,atkPressed:false,bumpHeld:false,setHeld:false};
let cfgOpen=false, cfgStage=0;
const toast=document.getElementById('toast');
const padcfg=document.getElementById('padcfg');
const padcfgInner=document.getElementById('padcfgInner');
let toastT=null;

function showToast(msg,ms=4500){
  toast.textContent=msg;toast.style.display='block';
  clearTimeout(toastT);toastT=setTimeout(()=>toast.style.display='none',ms);
}

addEventListener('gamepadconnected',e=>{
  pad.connected=true;pad.index=e.gamepad.index;
  pad.id=(e.gamepad.id||'GAMEPAD').slice(0,28).toUpperCase();
  pad.prev=[];
  showToast('PAD CONNECTED: '+pad.id+' · '+padLabel(pad.btnBump)+'=BUMP '+padLabel(pad.btnSet)+'=SET '+padLabel(pad.btnAtk)+'=ATTACK · OPTIONS/P TO CONFIGURE');
  beep(700,0.08,'square',0.07);
});
addEventListener('gamepaddisconnected',e=>{
  if(e.gamepad.index===pad.index){
    pad.connected=false;pad.index=null;
    if(cfgOpen)closeCfg();
    showToast('PAD DISCONNECTED — KEYBOARD ACTIVE');
  }
});

let padApiOk=true;
function padGp(){
  if(!pad.connected||!padApiOk)return null;
  try{
    const gps=navigator.getGamepads?navigator.getGamepads():[];
    return gps[pad.index]||null;
  }catch(err){
    // sandboxed iframes (like embedded previews) block the Gamepad API:
    // fail gracefully, fall back to keyboard, tell the player why
    padApiOk=false;pad.connected=false;
    if(cfgOpen)closeCfg();
    showToast('GAMEPAD BLOCKED IN THIS EMBEDDED VIEW — DOWNLOAD & OPEN THE FILE DIRECTLY IN YOUR BROWSER',7000);
    return null;
  }
}

function openCfg(){
  if(!pad.connected)return;
  cfgOpen=true;cfgStage=1;
  padcfg.style.display='block';
  renderCfg();
  beep(520,0.06,'square',0.07);
}
function closeCfg(){
  cfgOpen=false;
  padcfg.style.display='none';
  beep(760,0.08,'square',0.08);
}
function renderCfg(){
  const step=(n,name,desc)=>'<h2>PAD SETUP '+n+'/4</h2>'+
    '<div class="row">'+pad.id+'</div>'+
    '<div class="row" style="margin-top:14px;font-size:17px">PRESS THE BUTTON FOR<br><span class="hl">'+name+'</span></div>'+
    '<div class="row" style="font-size:12px">'+desc+'</div>'+
    '<div class="hint">MOVE: LEFT STICK / D-PAD (fixed) · OPTIONS = CANCEL</div>';
  if(cfgStage===1){
    padcfgInner.innerHTML=step(1,'BUMP / RECEPTION','bagher & diving save');
  }else if(cfgStage===2){
    padcfgInner.innerHTML=step(2,'SET','palleggio · bump-set on low balls');
  }else if(cfgStage===3){
    padcfgInner.innerHTML=step(3,'ATTACK','jump, then press again to spike');
  }else{
    padcfgInner.innerHTML=
      '<h2>PAD SETUP 4/4</h2>'+
      '<div class="row">MOVE: <span class="hl">LEFT STICK / D-PAD</span></div>'+
      '<div class="row">BUMP: <span class="hl">'+padLabel(pad.btnBump)+'</span></div>'+
      '<div class="row">SET: <span class="hl">'+padLabel(pad.btnSet)+'</span></div>'+
      '<div class="row">ATTACK: <span class="hl">'+padLabel(pad.btnAtk)+'</span></div>'+
      '<div class="row">STICK DEADZONE: <span class="hl">'+pad.dz.toFixed(2)+'</span> (D-PAD ◄ ► TO ADJUST)</div>'+
      '<div class="row" style="margin-top:14px">MOVE THE STICK TO TEST: <span class="hl" id="stickTest">·</span></div>'+
      '<div class="hint">PRESS <span class="hl">'+padLabel(pad.btnBump)+'</span> TO CONFIRM · OPTIONS TO REMAP</div>';
  }
}

// per-frame gamepad poll: fills padInput and drives the config wizard
function pollPad(){
  padInput.mx=0;padInput.mz=0;
  padInput.bumpPressed=false;padInput.setPressed=false;padInput.atkPressed=false;
  padInput.bumpHeld=false;padInput.setHeld=false;
  const gp=padGp();
  if(!gp)return;
  // edge detection over all buttons
  const pressed=[];
  gp.buttons.forEach((b,i)=>{
    const now=b.pressed||b.value>0.5;
    if(now&&!pad.prev[i])pressed.push(i);
    pad.prev[i]=now;
  });

  if(pressed.includes(9)){            // OPTIONS toggles / cancels / remaps
    if(!cfgOpen)openCfg();
    else if(cfgStage===4){cfgStage=1;renderCfg();}
    else closeCfg();
    return;
  }

  if(cfgOpen){
    if(cfgStage<=3){
      // capture one distinct button per fundamental
      const used=[];
      if(cfgStage>1)used.push(pad.btnBump);
      if(cfgStage>2)used.push(pad.btnSet);
      const b=pressed.find(i=>i!==9&&i!==16&&i<12&&!used.includes(i));
      if(b!==undefined){
        if(cfgStage===1)pad.btnBump=b;
        else if(cfgStage===2)pad.btnSet=b;
        else pad.btnAtk=b;
        cfgStage++;renderCfg();beep(620,0.05,'square',0.07);
      }
    }else{
      if(pressed.includes(14)){pad.dz=Math.max(0.10,+(pad.dz-0.04).toFixed(2));renderCfg();}
      if(pressed.includes(15)){pad.dz=Math.min(0.50,+(pad.dz+0.04).toFixed(2));renderCfg();}
      const t=document.getElementById('stickTest');
      if(t){
        const ax=gp.axes[0]||0, az=gp.axes[1]||0;
        const on=Math.hypot(ax,az)>pad.dz;
        t.textContent=on?('x:'+ax.toFixed(2)+' y:'+az.toFixed(2)):'· (in deadzone)';
      }
      if(pressed.includes(pad.btnBump)){
        closeCfg();
        showToast('PAD READY · '+padLabel(pad.btnBump)+'=BUMP '+padLabel(pad.btnSet)+'=SET '+padLabel(pad.btnAtk)+'=ATTACK');
      }
    }
    return; // while configuring, no game input
  }

  // ---- gameplay input ----
  let ax=gp.axes[0]||0, az=gp.axes[1]||0;
  if(Math.hypot(ax,az)<pad.dz){ax=0;az=0;}
  // d-pad overrides
  if(pad.prev[14])ax=-1; if(pad.prev[15])ax=1;
  if(pad.prev[12])az=-1; if(pad.prev[13])az=1;
  padInput.mx=clamp(ax,-1,1);
  padInput.mz=clamp(az,-1,1);
  padInput.bumpPressed=pressed.includes(pad.btnBump);
  padInput.setPressed=pressed.includes(pad.btnSet);
  padInput.atkPressed=pressed.includes(pad.btnAtk);
  padInput.bumpHeld=!!pad.prev[pad.btnBump];
  padInput.setHeld=!!pad.prev[pad.btnSet];
}

function setHUD(){
  scoreDiv.innerHTML=`<span class="usa">USA ${match.score.usa}</span> — <span class="swe">${match.score.swe} SWE</span>`;
}
function setTouchHUD(){
  if(match.state!=='rally'||!ball.live){touchDiv.textContent='';return;}
  const who=ball.lastSide===SIDE_USA?'USA':'SWE';
  const n=Math.min(ball.touches,3);
  touchDiv.textContent=who+' '+'●'.repeat(n)+'○'.repeat(3-n);
}
function showBanner(t){banner.textContent=t;banner.style.display='block';}
function hideBanner(){banner.style.display='none';}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function rnd(a){return (Math.random()*2-1)*a;}

function setupServe(){
  hitstop=0;
  setupServeRules(match, players, ball, court());
  setHUD();setTouchHUD();
  if(match.state==='over'){
    showBanner((match.winner===SIDE_USA?'USA WINS THE MATCH!':'SWEDEN WINS THE MATCH!')+'\nPRESS ENTER TO REPLAY');
  }else{
    refBlink=0;
    showBanner(match.servingSide===SIDE_USA?'USA TO SERVE\nPRESS SPACE':'SWEDEN SERVING…');
  }
}
function newMatch(){ resetScore(match); setupServe(); }

// ---------- ball launch ----------
function hitBall(px,pz,tx,tz,vyUp,hard,power=1,inherit=0){
  launchBall(ball,px,pz,tx,tz,vyUp,hard,power,inherit);
  if(hard)hitstop=Math.max(hitstop,0.055);
  beep(hard?200:340,0.06,'square',hard?0.11:0.08);
}

// ---------- rules ----------
function registerTouch(p){
  const fault=recordTouch(ball,p);
  if(fault){ pointTo(-p.side,fault); return false; }
  setTouchHUD();
  return true;
}

function pointTo(side,msg){
  awardPoint(match,side);
  serveBox.style.display='none';
  setHUD();touchDiv.textContent='';
  showBanner((side===SIDE_USA?'POINT USA!':'POINT SWEDEN!')+'\n'+msg);
  beep(2300,0.09,'square',0.06);setTimeout(()=>beep(2300,0.14,'square',0.06),120); // whistle
  beep(660,0.12,'square',0.1);setTimeout(()=>beep(880,0.15,'square',0.1),110);
}

function landingPoint(){ return ballLandingPoint(ball); }
// ============================================================
// SHOTS — logic in js/logic/shots.js; here we wire in the rules,
// the ball launch and the feedback (sand, hit-stop, sounds)
// ============================================================
const SHOT_SOUNDS={
  dive:   [430,0.08,'triangle',0.09],
  shank:  [260,0.07,'sawtooth',0.08],
  setDump:[560,0.05,'triangle',0.07],
  drop:   [520,0.05,'triangle',0.07],
};
const shots=createShots({
  ball, players, venue,
  touch: registerTouch,
  hit: hitBall,
  fx:{
    puff: sandPuff,
    hitstop: t=>{ hitstop=Math.max(hitstop,t); },
    sound: name=>beep(...SHOT_SOUNDS[name]),
  },
});
const { pickOpenTarget, aiSpike } = shots;

function startJump(p){
  if(jumpPlayer(p))beep(500,0.04,'triangle',0.05);
}

function startDive(p){
  divePlayer(p, landingPoint());
  sandPuff(p.x,p.z,5,1.0);
  beep(300,0.05,'triangle',0.06);
}


// ---------- shared movement ----------
function movePlayer(p,tvx,tvz,dt){ movePlayerBody(p,tvx,tvz,dt,court()); }
const busy=isBusy;

// ---------- human control ----------
function humanPlayer(){
  // whoever is aiming, winding up a touch or running up to attack keeps the control
  const busyHuman=players.find(p=>p.side===SIDE_USA&&(p.aim||p.approach||p.swingQueued||(p.windup>0&&p.wKind==='human')));
  if(busyHuman)return busyHuman;
  const lp=landingPoint();
  const ref=ball.live?lp:ball;
  let us=players.filter(p=>p.side===SIDE_USA);
  if(ball.lastToucher&&ball.lastToucher.side===SIDE_USA){
    const others=us.filter(p=>p!==ball.lastToucher);
    if(others.length)us=others;
  }
  return us.reduce((a,b)=>
    Math.hypot(a.x-ref.x,a.z-ref.z)<Math.hypot(b.x-ref.x,b.z-ref.z)?a:b);
}

// is the button that opened the aim still held? (charges the touch height)
function actionHeld(mode){
  if(mode==='bump')return !!(keysDown['KeyZ']||keysDown['KeyJ']||padInput.bumpHeld);
  if(mode==='set') return !!(keysDown['KeyX']||keysDown['KeyK']||padInput.setHeld);
  return !!keysDown['Space'];
}

// feedback for the human player's body actions (logic in js/logic/humanControl.js)
const HUMAN_FX={
  step: p=>{ sandPuff(p.x,p.z,2,0.5); beep(160,0.03,'triangle',0.05); },   // run-up footfall
  jump: p=>{ beep(500,0.04,'triangle',0.05); },
  dive: p=>{ sandPuff(p.x,p.z,5,1.0); beep(300,0.05,'triangle',0.06); },
};

function updateHuman(dt,p){
  let mx=0,mz=0;
  if(keys['ArrowLeft']||keys['KeyA'])mx-=1;
  if(keys['ArrowRight']||keys['KeyD'])mx+=1;
  if(keys['ArrowUp']||keys['KeyW'])mz-=1;
  if(keys['ArrowDown']||keys['KeyS'])mz+=1;
  // gamepad: analog stick adds fine control, d-pad acts like arrows
  mx+=padInput.mx; mz+=padInput.mz;
  const l=Math.max(1,Math.hypot(mx,mz));
  mx/=l; mz/=l;

  // serve: any action button once the referee has whistled
  const anyBtn=btnEdges.bump||btnEdges.set||btnEdges.atk||btnEdges.auto;
  if((keys['Space']||anyBtn)&&canServe(match,SIDE_USA)){
    keys['Space']=false;btnEdges.bump=btnEdges.set=btnEdges.atk=btnEdges.auto=false;
    let tx=ball.x+mx*2.2, tz=wz(-SIDE_USA, 3.5+Math.random()*3);
    ball.y=2.0;   // struck at full extension: clears the tape with margin
    hitBall(ball.x,ball.z,tx,tz,8.0,false);
    makeFloat(ball);
    startRally(match,ball,p);
    hideBanner();ball.aftertouch=0.6;setTouchHUD();
  }

  updateHumanControl(p,
    { mx, mz, bump:btnEdges.bump, set:btnEdges.set, atk:btnEdges.atk, auto:btnEdges.auto, held:actionHeld },
    dt,
    { ball, court:court(), shots, canAct:match.state==='rally', fx:HUMAN_FX });
}



// ---------- AI ----------

function updateAI(dt,human){
  const lp=landingPoint();
  players.forEach(p=>{
    if(p===human)return;
    p.cool=Math.max(0,p.cool-dt);
    let tx=p.home.x,tz=p.home.z;
    if(match.state==='serve'){ tx=p.x; tz=p.z; }   // hold serve formation (server stays behind the line)
    const ballComing = ball.live && courtSideAtZ(lp.z, court()) === p.side;
    let myTeam=players.filter(q=>q.side===p.side);
    if(ball.lastToucher&&ball.lastToucher.side===p.side){
      const others=myTeam.filter(q=>q!==ball.lastToucher);
      if(others.length)myTeam=others;
    }
    const nearest=myTeam.reduce((a,b)=>
      Math.hypot(a.x-lp.x,a.z-lp.z)<Math.hypot(b.x-lp.x,b.z-lp.z)?a:b);

    if(ballComing&&nearest===p){
      tx=lp.x;tz=lp.z;
      if(!p.air&&!busy(p)&&ball.vy<0&&lp.t<0.4){
        const d=Math.hypot(lp.x-p.x,lp.z-p.z);
        if(d>PLAYER_SPEED*0.92*lp.t+0.7&&d<3.2)startDive(p);
      }
    }else if(ball.live&&ball.lastSide===p.side&&ball.touches===1&&courtSideAtZ(lp.z, court())===p.side){
      tx=wx(clamp(lp.x - court().centerX, -2.4, 2.4));tz=wz(p.side, 1.5);
    }
    let dx=tx-p.x,dz=tz-p.z;
    const d=Math.hypot(dx,dz);
    let tvx=0,tvz=0;
    if(d>0.06){
      const s=PLAYER_SPEED*0.92*(p.air?0.3:1)*Math.min(1,d/0.55);
      tvx=dx/d*s;tvz=dz/d*s;
    }
    movePlayer(p,tvx,tvz,dt);

    if(ball.live&&p.cool<=0&&!busy(p)&&ball.lastToucher!==p&&isOnCourtSide(ball.z, p.side, court())){
      const dist=Math.hypot(ball.x-p.x,ball.z-p.z);
      if(p.air){
        if(dist<1.35&&ball.y>1.5&&ball.y<p.jumpH+3.2&&ball.vy<0){
          aiSpike(p);
        }
      }else{
        const canGround=dist<HIT_RADIUS&&ball.y<REACH_GROUND&&ball.vy<2.5;
        const setUp=ball.lastSide===p.side&&ball.touches===2;
        if(setUp&&Math.abs(lz(p.z))<3.6&&dist<1.6&&ball.vy<0&&ball.y<3.8&&ball.y>1.8){
          startJump(p);
        }else if(canGround){
          p.windup=WINDUP+Math.random()*0.04;p.wKind='ai';
          p.faceA=faceAngle(p,ball.x,ball.z);
        }
      }
    }

    // AI serve: only after the whistle, and never sooner than 2s after it
    if(canServe(match,SIDE_SWE)&&p===match.server&&aiReadyToServe(match)){
      const t=pickOpenTarget(SIDE_SWE);
      const jumpSrv=Math.random()<0.25;
      if(jumpSrv){
        startJump(p);
        ball.y=2.4;
        hitBall(ball.x,ball.z,t.x+rnd(0.8),t.z+rnd(0.8),6.0,true,1.0);
        p.poseKind='spikeHit';p.poseT=0.3;   // serve swing follow-through
      }else{
        ball.y=2.0;
        const dz2=wz(SIDE_USA, clamp(lz(t.z), 3.2, court().half-1.2));
        hitBall(ball.x,ball.z,t.x+rnd(0.6),dz2+rnd(0.6),8.0,false);
        makeFloat(ball);
      }
      startRally(match,ball,p);
      hideBanner();setTouchHUD();
    }
  });
}



// ---------- wind-ups & dives ----------

// anticipation: whoever is about to receive coils into the ready pose
function updateReady(){
  players.forEach(p=>p.ready=false);
  if(!ball.live)return;
  const lp=landingPoint();
  players.forEach(p=>{
    if(p.air||busy(p)||p.poseT>0)return;
    if(courtSideAtZ(lp.z, court())!==p.side)return;
    if(ball.lastToucher===p)return;
    const d=Math.hypot(lp.x-p.x,lp.z-p.z);
    if(d<2.2&&lp.t<0.8){
      p.ready=true;
      p.faceA=faceAngle(p,ball.x,ball.z);
    }
  });
}

// ---------- jump physics ----------
function updateJumps(dt){
  stepJumps(players,dt).forEach(p=>sandPuff(p.x,p.z,4,0.8));   // touch-down puff
}

// ---------- ball physics ----------
function updateBall(dt){
  // aftertouch: the human curves the ball with left/right
  const steer=((keys['ArrowRight']||keys['KeyD']||padInput.mx>0.35)?1:0)
             -((keys['ArrowLeft'] ||keys['KeyA']||padInput.mx<-0.35)?1:0);
  const ev=stepBall(ball, dt, court(), steer);
  if(ev.net==='tape')beep(180,0.06,'sawtooth',0.09);   // net cord, ball stays live
  else if(ev.net==='body')beep(140,0.08,'sawtooth',0.1);

  if(ev.landed){
    sandPuff(ball.x,ball.z,6,1.0);
    beep(90,0.1,'sawtooth',0.12);
    if(match.state!=='rally'&&match.state!=='serve')return;
    const r=judgeLanding(ball,court());
    pointTo(r.side,r.msg);
  }
}

// ---------- render sync ----------
function sync(){
  playersView.sync();

  ballView.sync(ball);
  aimView.sync(players);

  const h=humanPlayer();
  marker.position.set(h.x,0.13,h.z-1.0);

  venueView.officials.update({
    signal: match.state==='point',
    authT: match.state==='serve'?authT:0,
    servingSide: match.servingSide,
    ballZ: ball.z,
  });

}

// ---------- main loop ----------
let last=performance.now();
function loop(now){
  requestAnimationFrame(loop);
  let dt=Math.min((now-last)/1000,0.033);last=now;

  pollPad();
  // merge pad presses into the shared button intents
  if(!cfgOpen){
    btnEdges.bump=btnEdges.bump||padInput.bumpPressed;
    btnEdges.set =btnEdges.set ||padInput.setPressed;
    btnEdges.atk =btnEdges.atk ||padInput.atkPressed;
    if(match.state==='over'&&(btnEdges.bump||btnEdges.set||btnEdges.atk||btnEdges.auto)){
      btnEdges.bump=btnEdges.set=btnEdges.atk=btnEdges.auto=false;
      newMatch();
    }
  }

  if(cfgOpen){ sync(); renderer.render(scene,cam); return; }  // paused while configuring

  if(hitstop>0){hitstop-=dt;dt=0;}
  if(ball.squashT>0)ball.squashT-=Math.max(dt,0.0001);
  if(authT>0)authT-=Math.max(dt,0.0001);

  if(match.state==='point'){
    if(tickPoint(match,dt))setupServe();
  }

  if(match.state==='serve'||match.state==='rally'){
    // referee window + 8 second service rule (after a 3s prep phase)
    if(match.state==='serve'){
      const sv=tickServe(match,dt);
      if(sv.whistle){
        authT=REF_AUTH_TIME;              // arm sweeps from server to net
        beep(2300,0.12,'square',0.07);   // referee whistles: service authorized
      }
      if(match.servePhase==='prep'||sv.whistle){
        serveBox.style.display='none';
      }else{
        serveBox.style.display='block';
        refBlink+=dt;
        if(refBlink>0.5)refBlink=0;
        drawRefIcon(refBlink<0.3);
        const tLeft=Math.max(0,match.serveTimer);
        serveTimeEl.textContent=Math.ceil(tLeft);
        serveBarEl.style.width=(tLeft/SERVE_LIMIT*100)+'%';
        serveBarEl.style.background=tLeft<3?'#ff5a5a':'#7bff6e';
        if(sv.timeout){
          serveBox.style.display='none';
          pointTo(-match.servingSide,'8 SECONDS!');   // delay of service
        }
      }
    }else{
      serveBox.style.display='none';
    }

    const h=humanPlayer();
    updateHuman(dt,h);
    updateAI(dt,h);
    shots.stepActions(dt);
    updateJumps(dt);
    updateBall(dt);
    updateReady();
    if(ball.live)recordTrail(ball);
    if(match.state==='serve'&&match.server){
      holdBallForServe(match,ball);
    }
  }
  btnEdges.bump=btnEdges.set=btnEdges.atk=btnEdges.auto=false;   // edges are one frame only
  updatePuffs(Math.max(dt,0));
  sync();
  renderer.render(scene,cam);
}

resize();
setupServe();
requestAnimationFrame(loop);
</script>
</body>
